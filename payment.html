<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pay with D-Money — Third-Party Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: #f4f6f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 20px;
    }
    .card {
      background: #fff; border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      padding: 36px 32px; width: 100%; max-width: 520px;
    }
    .logo { font-size: 22px; font-weight: 700; color: #1a1a2e; margin-bottom: 6px;
      display: flex; align-items: center; gap: 10px; }
    .env-badge {
      font-size: 10px; font-weight: 700; letter-spacing: 0.5px;
      padding: 3px 8px; border-radius: 4px;
      background: #fef3c7; color: #92400e;
    }
    .subtitle { font-size: 13px; color: #6b7280; margin-bottom: 22px; }
    .field { margin-bottom: 12px; }
    label { display: block; font-size: 12px; font-weight: 600; color: #374151; margin-bottom: 5px;
      text-transform: uppercase; letter-spacing: .4px; }
    input, textarea {
      width: 100%; padding: 9px 12px;
      border: 1px solid #d1d5db; border-radius: 8px;
      font-size: 14px; color: #111827; outline: none; transition: border-color .2s;
      font-family: inherit;
    }
    input:focus, textarea:focus { border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79,70,229,0.10); }
    textarea { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; min-height: 80px; }
    .mode-switch { display: flex; gap: 6px; margin-bottom: 14px; }
    .mode-btn {
      flex: 1; padding: 7px; border-radius: 6px; cursor: pointer;
      font-size: 13px; font-weight: 600; text-align: center;
      background: #f3f4f6; color: #6b7280; border: 1px solid #e5e7eb;
    }
    .mode-btn.active { background: #4f46e5; color: #fff; border-color: #4f46e5; }
    .row2 { display: grid; grid-template-columns: 2fr 1fr; gap: 8px; }
    .item-row { display: grid; grid-template-columns: 2fr 1fr auto; gap: 8px; align-items: center; margin-bottom: 8px; }
    .item-row button { padding: 8px 10px; background: #fee2e2; color: #dc2626; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; }
    .add-item { display: inline-block; padding: 6px 12px; background: #e0e7ff; color: #4f46e5;
                border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; margin-top: 4px; }
    .summary {
      background: #f9fafb; border: 1px solid #e5e7eb;
      border-radius: 10px; padding: 12px 14px; margin: 14px 0;
    }
    .summary-row {
      display: flex; justify-content: space-between;
      font-size: 13px; color: #374151; margin-bottom: 4px;
    }
    .summary-row.total {
      font-weight: 700; font-size: 16px; color: #111827;
      border-top: 1px solid #e5e7eb; padding-top: 8px; margin-top: 6px;
    }
    .pay-btn {
      width: 100%; padding: 12px;
      background: #4f46e5; color: #fff;
      font-size: 15px; font-weight: 600;
      border: none; border-radius: 10px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    .pay-btn:hover:not(:disabled) { background: #4338ca; }
    .pay-btn:disabled { background: #9ca3af; cursor: not-allowed; }
    .spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.4); border-top-color: #fff;
      border-radius: 50%; animation: spin .7s linear infinite; display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .alert { margin-top: 12px; padding: 9px 12px; border-radius: 8px; font-size: 13px; display: none; }
    .alert.err { background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; word-break: break-word; }
    .result-box { display: none; margin-top: 14px; border: 1.5px solid #4f46e5; border-radius: 12px; overflow: hidden; }
    .result-header { background: #4f46e5; color: #fff; font-size: 13px; font-weight: 600; padding: 9px 14px; }
    .url-wrap { padding: 12px; background: #f5f3ff; }
    .url-text { font-family: ui-monospace, monospace; font-size: 11px; color: #374151;
      word-break: break-all; line-height: 1.6;
      background: #fff; border: 1px solid #e5e7eb; border-radius: 8px;
      padding: 8px 10px; max-height: 130px; overflow-y: auto; margin-bottom: 10px; }
    .result-actions { display: flex; gap: 6px; }
    .action-btn { flex: 1; padding: 8px; font-size: 13px; font-weight: 600;
      border: none; border-radius: 6px; cursor: pointer; }
    .btn-copy { background: #f3f4f6; color: #374151; }
    .btn-copy.copied { background: #d1fae5; color: #065f46; }
    .btn-open { background: #4f46e5; color: #fff; }
    .order-info { padding: 8px 12px; background: #f9fafb; border-top: 1px solid #e5e7eb;
      font-size: 11px; color: #6b7280; }
    .order-info strong { color: #374151; }
    .secure-note { text-align: center; font-size: 11px; color: #9ca3af; margin-top: 14px; }
  </style>
</head>
<body>

<div class="card">
  <div class="logo">
    Third-Party Demo
    <span class="env-badge">API v2</span>
  </div>
  <div class="subtitle">Paste your lifetime API token, then send amount + description.</div>

  <div class="field">
    <label>API Token (tp_live_…)</label>
    <input type="password" id="token" placeholder="tp_live_xxxxxxxxxxxxxxxx" autocomplete="off"/>
  </div>

  <div class="mode-switch">
    <div class="mode-btn active" id="mode-single" onclick="setMode('single')">Single Item</div>
    <div class="mode-btn"        id="mode-bulk"   onclick="setMode('bulk')">Bulk Items</div>
  </div>

  <!-- Single -->
  <div id="single-mode">
    <div class="field">
      <label>Description</label>
      <input id="s-desc" value="Test payment 10 DJF" maxlength="256"/>
    </div>
    <div class="field">
      <label>Amount (DJF)</label>
      <input id="s-amount" type="number" value="10" min="1"/>
    </div>
  </div>

  <!-- Bulk -->
  <div id="bulk-mode" style="display:none;">
    <label>Items</label>
    <div id="bulk-rows"></div>
    <button class="add-item" onclick="addRow()">+ Add item</button>
  </div>

  <div class="summary">
    <div class="summary-row"><span>Items</span><span id="s-count">1</span></div>
    <div class="summary-row"><span>Currency</span><span>DJF</span></div>
    <div class="summary-row total"><span>Total</span><span id="s-total">10 DJF</span></div>
  </div>

  <button class="pay-btn" id="pay-btn" onclick="pay()">
    <div class="spinner" id="spinner"></div>
    <span id="btn-text">Pay Now</span>
  </button>

  <div class="result-box" id="result-box">
    <div class="result-header">
      <span id="result-title">Checkout URL generated</span>
      <span class="small" style="float:right;" id="poll-indicator"></span>
    </div>
    <div class="url-wrap">
      <div id="status-banner" style="
        display:none; padding:12px; border-radius:8px; margin-bottom:10px;
        text-align:center; font-weight:600;"></div>
      <div class="url-text" id="url-text"></div>
      <div class="result-actions">
        <button class="action-btn btn-copy" id="copy-btn" onclick="copyUrl()">Copy URL</button>
        <button class="action-btn btn-open" onclick="openUrl()">Open Payment Page</button>
      </div>
    </div>
    <div class="order-info">
      Order: <strong id="r-order">—</strong>  ·  Prepay: <strong id="r-prepay">—</strong>  ·  Status: <strong id="r-status">PENDING</strong>
    </div>
  </div>

  <div class="alert err" id="alert-err"></div>

  <div class="secure-note">🔒 Routed through the D-Money Payment API platform</div>
</div>

<script>
  const API = (() => {
    const h = location.hostname;
    if (!h || h === "localhost" || h === "127.0.0.1") return "http://localhost:8000";
    return location.origin;
  })();

  let mode = "single";
  let checkoutUrl = "";
  let currentOrderId = "";
  let pollTimer = null;
  let pollStartedAt = 0;
  let dmoneyWin = null;          // window reference to D-Money tab

  document.getElementById("token").value = localStorage.getItem("tp_token") || "";
  document.getElementById("token").addEventListener("change", e => {
    localStorage.setItem("tp_token", e.target.value.trim());
  });

  function setMode(m) {
    mode = m;
    document.getElementById("mode-single").classList.toggle("active", m === "single");
    document.getElementById("mode-bulk").classList.toggle("active", m === "bulk");
    document.getElementById("single-mode").style.display = m === "single" ? "" : "none";
    document.getElementById("bulk-mode").style.display   = m === "bulk"   ? "" : "none";
    if (m === "bulk" && document.getElementById("bulk-rows").children.length === 0) {
      addRow(); addRow();
    }
    refresh();
  }

  function addRow() {
    const wrap = document.createElement("div");
    wrap.className = "item-row";
    wrap.innerHTML = `
      <input class="b-desc"   placeholder="Description" maxlength="256"/>
      <input class="b-amount" type="number" placeholder="Amount" min="1"/>
      <button onclick="this.parentElement.remove(); refresh();" title="Remove">×</button>`;
    document.getElementById("bulk-rows").appendChild(wrap);
    wrap.querySelectorAll("input").forEach(i => i.addEventListener("input", refresh));
  }

  function readBulk() {
    return [...document.querySelectorAll("#bulk-rows .item-row")].map(r => ({
      description: r.querySelector(".b-desc").value.trim(),
      amount:      parseFloat(r.querySelector(".b-amount").value) || 0,
    })).filter(it => it.description && it.amount > 0);
  }

  function refresh() {
    let total = 0, count = 1;
    if (mode === "single") {
      total = parseFloat(document.getElementById("s-amount").value) || 0;
    } else {
      const items = readBulk();
      total = items.reduce((s, it) => s + it.amount, 0);
      count = items.length || 0;
    }
    document.getElementById("s-count").textContent = count;
    document.getElementById("s-total").textContent = total.toLocaleString() + " DJF";
  }

  ["s-amount","s-desc"].forEach(id => document.getElementById(id).addEventListener("input", refresh));

  function showError(msg) {
    const el = document.getElementById("alert-err");
    el.textContent = msg; el.style.display = "block";
  }

  async function pay() {
    const token = document.getElementById("token").value.trim();
    const btn = document.getElementById("pay-btn");
    const spinner = document.getElementById("spinner");
    const btnText = document.getElementById("btn-text");

    document.getElementById("alert-err").style.display = "none";
    document.getElementById("result-box").style.display = "none";

    if (!token) return showError("API token required.");

    let body;
    if (mode === "single") {
      const description = document.getElementById("s-desc").value.trim();
      const amount = parseFloat(document.getElementById("s-amount").value);
      if (!description) return showError("Description required.");
      if (!amount || amount < 1) return showError("Valid amount required.");
      body = { amount, description };
    } else {
      const items = readBulk();
      if (!items.length) return showError("Add at least one item with description + amount.");
      body = { items };
    }

    btn.disabled = true;
    spinner.style.display = "block";
    btnText.textContent = "Generating…";

    try {
      const res = await fetch(`${API}/api/payments`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + token,
        },
        body: JSON.stringify(body),
      });
      let data;
      try { data = await res.json(); }
      catch { throw new Error(`Server returned non-JSON (HTTP ${res.status})`); }

      if (!res.ok) throw new Error(data.detail || `HTTP ${res.status}`);
      if (!data.checkout_url) throw new Error("No checkout_url in response.");

      checkoutUrl    = data.checkout_url;
      currentOrderId = data.order_id;
      document.getElementById("url-text").textContent = checkoutUrl;
      document.getElementById("r-order").textContent  = data.order_id  || "—";
      document.getElementById("r-prepay").textContent = data.prepay_id || "—";
      document.getElementById("r-status").textContent = "PENDING";
      const cb = document.getElementById("copy-btn");
      cb.textContent = "Copy URL"; cb.classList.remove("copied");
      document.getElementById("result-box").style.display = "block";

      // Open D-Money checkout in a new tab automatically and start polling.
      // The buyer pays in the new tab; this page polls our backend, which
      // does live D-Money queryOrder for PENDING — no "Return to merchant"
      // click required for the merchant page to know the result.
      dmoneyWin = window.open(checkoutUrl, "_blank");
      startStatusPolling(data.order_id, token);
    } catch (e) {
      showError("Error: " + e.message);
    } finally {
      btn.disabled = false;
      spinner.style.display = "none";
      btnText.textContent = "Pay Now";
    }
  }

  // ── Live status polling ─────────────────────────────────────────────
  function showBanner(text, color, bg) {
    const b = document.getElementById("status-banner");
    b.textContent = text;
    b.style.background = bg;
    b.style.color = color;
    b.style.border = "1px solid " + color;
    b.style.display = "block";
  }

  function stopPolling() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    document.getElementById("poll-indicator").textContent = "";
  }

  async function pollOnce(orderId, token) {
    try {
      const r = await fetch(`${API}/api/payments/${encodeURIComponent(orderId)}`, {
        headers: { "Authorization": "Bearer " + token },
      });
      if (!r.ok) return null;
      const data = await r.json();
      return data.status;
    } catch { return null; }
  }

  function startStatusPolling(orderId, token) {
    stopPolling();
    pollStartedAt = Date.now();
    showBanner("⏳ Waiting for payment on D-Money…", "#92400e", "#fef3c7");
    document.getElementById("poll-indicator").textContent = "checking every 2s…";

    pollTimer = setInterval(async () => {
      const elapsed = Math.floor((Date.now() - pollStartedAt) / 1000);
      document.getElementById("poll-indicator").textContent =
        `checking every 2s · ${elapsed}s elapsed`;

      const status = await pollOnce(orderId, token);
      if (!status) return;
      document.getElementById("r-status").textContent = status;

      if (status === "PAID") {
        showBanner("✅ Payment received — order is PAID", "#065f46", "#d1fae5");
        document.getElementById("result-title").textContent = "Payment complete";
        stopPolling();
      } else if (status === "FAILED" || status === "CANCELLED" || status === "EXPIRED") {
        showBanner(`❌ Payment ${status}`, "#991b1b", "#fee2e2");
        stopPolling();
      } else if (elapsed >= 10 * 60) {
        // 10-minute safety stop
        showBanner("⌛ Stopped polling after 10 min. Reload to retry.", "#92400e", "#fef3c7");
        stopPolling();
      }
    }, 2000);
  }

  function openUrl() {
    if (!checkoutUrl) return;
    // Reuse existing D-Money tab if still open, else spawn a new one
    if (dmoneyWin && !dmoneyWin.closed) {
      dmoneyWin.focus();
    } else {
      dmoneyWin = window.open(checkoutUrl, "_blank");
    }
  }
  function copyUrl() {
    if (!checkoutUrl) return;
    const done = () => {
      const b = document.getElementById("copy-btn");
      b.textContent = "Copied!"; b.classList.add("copied");
      setTimeout(() => { b.textContent = "Copy URL"; b.classList.remove("copied"); }, 2000);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(checkoutUrl).then(done).catch(() => {});
    }
  }

  refresh();
</script>
</body>
</html>
